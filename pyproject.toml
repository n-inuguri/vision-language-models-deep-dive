[project]
name = "vlm-dd"
version = "0.1.0"
description = "Four-part VLM deep dive: from-scratch VLM, document field extraction, single-document visual QA, and retrieval-augmented visual QA"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.35.0",
    "gradio>=6.22.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "nltk>=3.10.0",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "peft>=0.19.1",
    "pillow>=12.3.0",
    "pyarrow>=25.0.0",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
